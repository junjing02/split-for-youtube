<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon48.png" width="22" height="22" alt="" />
    <h1>Split for YouTube</h1>
    <label class="master" for="splitEnabled" title="Turn the whole extension on or off">
      <input type="checkbox" id="splitEnabled" role="switch" aria-label="Split layout" />
      <span class="switch" aria-hidden="true"></span>
    </label>
  </header>

  <main id="options">
    <label class="row" for="twoWindowMode">
      <span class="text">
        <span class="title">Two windows</span>
        <span class="desc">Keep the video here and open everything else in a second window.</span>
      </span>
      <input type="checkbox" id="twoWindowMode" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row" for="ambientEnabled">
      <span class="text">
        <span class="title">Ambient light</span>
        <span class="desc">Glow the video's colors behind the page. In dark theme it follows YouTube's Ambient mode.</span>
      </span>
      <input type="checkbox" id="ambientEnabled" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row slider-row" for="ambientStrength">
      <span class="title">Glow in dark theme</span>
      <input type="range" id="ambientStrength" min="10" max="100" step="5" />
      <output id="ambientStrengthValue" for="ambientStrength"></output>
    </label>

    <label class="row slider-row" for="ambientStrengthLight">
      <span class="title">Glow in light theme</span>
      <input type="range" id="ambientStrengthLight" min="10" max="100" step="5" />
      <output id="ambientStrengthLightValue" for="ambientStrengthLight"></output>
    </label>

    <label class="row compact" for="showRecommendations">
      <span class="title">Show recommendations</span>
      <input type="checkbox" id="showRecommendations" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact" for="showComments">
      <span class="title">Show comments</span>
      <input type="checkbox" id="showComments" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact" for="sideWidth">
      <span class="title">Side pane width</span>
      <select id="sideWidth">
        <option value="auto">Fit the video</option>
        <option value="narrow">Narrow</option>
        <option value="balanced">Balanced</option>
        <option value="wide">Half and half</option>
      </select>
    </label>

    <label class="row" for="rememberLayout">
      <span class="text">
        <span class="title">Remember my layout</span>
        <span class="desc">Keep pane sizes and collapsed panes from one video to the next.</span>
      </span>
      <input type="checkbox" id="rememberLayout" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row" for="videoOnRight">
      <span class="text">
        <span class="title">Video on the right</span>
        <span class="desc">Swap sides: panes on the left, video on the right.</span>
      </span>
      <input type="checkbox" id="videoOnRight" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>
  </main>

  <footer>
    <span id="version"></span>
    <span class="links">
      <a href="#" id="shortcuts">Shortcuts</a>
      <a href="https://github.com/junjing02/split-for-youtube/releases" target="_blank" rel="noopener">What's new</a>
      <a href="https://github.com/junjing02/split-for-youtube/issues/new/choose" target="_blank" rel="noopener">Report a problem</a>
    </span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
